workflows:
  ios-workflow:
    name: iOS Workflow
    environment:
      xcode: latest
    scripts:
      - name: Install dependencies
        script: pod install
      - name: Build for iOS
        script: xcodebuild -workspace GIAMSAI2026.xcworkspace -scheme GIAMSAI2026 -sdk iphoneos -configuration Release archive -archivePath $CM_BUILD_DIR/GIAMSAI2026.xcarchive
      - name: Export .ipa
        script: xcodebuild -exportArchive -archivePath $CM_BUILD_DIR/GIAMSAI2026.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath $CM_BUILD_DIR
    artifacts:
      - path: $CM_BUILD_DIR